<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Promo video page</title>
  <link rel="stylesheet" href="node_modules/@fontsource-variable/noto-sans-sc/index.css">
  <link rel="stylesheet" href="node_modules/@fontsource-variable/inter-tight/index.css">
  <link rel="stylesheet" href="node_modules/@fontsource-variable/jetbrains-mono/index.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div class="backdrop"></div>
    <div id="scenes"></div>
    <div id="subtitles"><span></span></div>
  </div>
  <div id="dev" hidden>
    <button id="play">▶</button><input id="scrub" type="range" min="0" step="0.001"><span id="clock">0.00</span>
  </div>
  <!-- GSAP core and the plugins motion/motion.js uses; all ship in the public gsap package. -->
  <script src="node_modules/gsap/dist/gsap.min.js"></script>
  <script src="node_modules/gsap/dist/SplitText.min.js"></script>
  <script src="node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
  <script src="node_modules/gsap/dist/MorphSVGPlugin.min.js"></script>
  <script src="node_modules/gsap/dist/MotionPathPlugin.min.js"></script>
  <script src="node_modules/gsap/dist/ScrambleTextPlugin.min.js"></script>
  <script src="node_modules/gsap/dist/TextPlugin.min.js"></script>
  <script src="node_modules/gsap/dist/CustomEase.min.js"></script>
  <script src="node_modules/gsap/dist/CustomWiggle.min.js"></script>
  <script src="node_modules/gsap/dist/Flip.min.js"></script>
  <script src="node_modules/gsap/dist/Physics2DPlugin.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
